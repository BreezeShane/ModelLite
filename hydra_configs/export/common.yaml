defaults:
  - _self_
  - engine: onnx

save_dir: "./saved_models"
input_shape: [1, 3, 224, 224] # [batch_size, channels, height, width]
input_dtype: "float32"
input_names: ["input"]
output_names: ["output"]
dynamic_batch: true

fuse_layers: true
constant_folding: true
remove_identity_ops: true

device: "cpu"
compute_precision: "fp32" # fp32, fp16, int8, mixed